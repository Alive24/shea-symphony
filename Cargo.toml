[package]
name = "shea-symphony"
version = "0.1.0"
edition = "2021"
description = "Rust implementation of an OpenAI Symphony-style orchestration harness with Shea Symphony extensions"
license = "Apache-2.0"
default-run = "shea-symphony"

[[bin]]
name = "shea-symphony-legacy"
path = "src/legacy.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
futures = "0.3.32"
futures-util = "0.3.32"
liquid = "0.26.11"
libc = "0.2"
ratatui = "0.29"
rusqlite = { version = "0.38", features = ["bundled"] }
sea-query = { version = "1.0", default-features = false, features = ["backend-sqlite"] }
sea-query-rusqlite = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
signal-hook = "0.3"
temporalio-client = "0.5.0"
temporalio-common = "0.5.0"
temporalio-macros = "0.5.0"
temporalio-sdk = "0.5.0"
temporalio-sdk-core = "0.5.0"
temporalio-workflow = "0.5.0"
thiserror = "1"
time = { version = "0.3", features = ["formatting", "parsing"] }
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
tempfile = "3"
