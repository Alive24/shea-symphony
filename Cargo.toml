[package]
name = "shea-symphony"
version = "0.1.0"
edition = "2021"
description = "Rust implementation of an OpenAI Symphony-style orchestration harness with Shea Symphony extensions"
license = "Apache-2.0"

[dependencies]
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
libc = "0.2"
liquid = "0.26.11"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
signal-hook = "0.3"
thiserror = "1"

[dev-dependencies]
tempfile = "3"
